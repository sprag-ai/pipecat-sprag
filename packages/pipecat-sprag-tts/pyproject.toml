[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-sprag-tts"
version = "0.1.0"
description = "Sprag Chorus text-to-speech service for Pipecat"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
authors = [{ name = "Sprag AI Inc." }]
keywords = ["pipecat", "sprag", "voice", "ai"]
dependencies = [
    "pipecat-ai>=1.8,<2",
    "pipecat-sprag-common==0.1.0",
]

[project.urls]
Homepage = "https://sprag.ai"
Source = "https://github.com/sprag-ai/pipecat-sprag"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_sprag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-sprag-common"
version = "0.1.0"
description = "Shared configuration for the Sprag Pipecat services"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
authors = [{ name = "Sprag" }]
keywords = ["pipecat", "sprag", "voice", "ai"]
dependencies = []

[project.urls]
Homepage = "https://sprag.ai"
Source = "https://github.com/sprag-ai/pipecat-sprag"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_sprag"]

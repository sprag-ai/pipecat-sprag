[project]
name = "pipecat-sprag-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pipecat-sprag-common",
    "pipecat-sprag-llm",
    "pipecat-sprag-stt",
    "pipecat-sprag-tts",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pipecat-sprag-common = { workspace = true }
pipecat-sprag-llm = { workspace = true }
pipecat-sprag-stt = { workspace = true }
pipecat-sprag-tts = { workspace = true }

[dependency-groups]
examples = [
    "pipecat-ai[daily,runner,webrtc]>=1.8,<2",
    "python-dotenv>=1.0",
]
dev = [
    "aiohttp>=3.10",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pipecat_sprag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls api.sprag.ai and needs SPRAG_API_KEY"]
addopts = "-m 'not live'"
# a hung test fails with a traceback instead of stalling CI
timeout = 30

[tool.mypy]
strict = true
# pipecat's own methods are largely unannotated
disallow_untyped_calls = false
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/pipecat-sprag-common/src", "packages/pipecat-sprag-llm/src", "packages/pipecat-sprag-stt/src", "packages/pipecat-sprag-tts/src"]

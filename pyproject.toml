[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-sprag"
version = "0.1.0"
description = "Sprag speech and language models for Pipecat: Rhythm STT, Symphony LLM, and Chorus TTS"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
authors = [{ name = "Sprag AI Inc." }]
keywords = ["pipecat", "sprag", "voice", "ai", "stt", "tts", "llm"]
dependencies = ["pipecat-ai>=1.8,<2"]

[project.urls]
Homepage = "https://sprag.ai"
Source = "https://github.com/sprag-ai/pipecat-sprag"
Changelog = "https://github.com/sprag-ai/pipecat-sprag/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_sprag"]

[tool.hatch.build.targets.sdist]
include = ["src/pipecat_sprag", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
examples = [
    "pipecat-ai[daily,runner,webrtc]>=1.8,<2",
    "python-dotenv>=1.0",
]
dev = [
    "aiohttp>=3.10",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pipecat_sprag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls api.sprag.ai and needs SPRAG_API_KEY"]
addopts = "-m 'not live'"
# a hung test fails with a traceback instead of stalling CI
timeout = 30

[tool.mypy]
strict = true
# pipecat's own methods are largely unannotated
disallow_untyped_calls = false
mypy_path = ["src"]
